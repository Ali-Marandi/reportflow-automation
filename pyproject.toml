[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "reportflow-automation"
version = "1.0.0"
description = "Professional multi-source financial reporting automation tool"
readme = "README.md"
authors = [
    {name = "Ali Marandi", email = "Marandi@outlook.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "pandas>=2.1.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "APScheduler>=3.10.0",
    "SQLAlchemy>=2.0.0",
]

[project.scripts]
reportflow = "reportflow.cli:cli"

[tool.setuptools.package-data]
reportflow = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/reportflow"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
