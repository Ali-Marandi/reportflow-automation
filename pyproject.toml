[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportflow-automation"
version = "0.1.0"
description = "Config-driven multi-source financial reporting automation"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
reportflow = "reportflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
